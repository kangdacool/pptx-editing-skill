name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install python-pptx Pillow lxml
      - name: Run selftest (proves speaker_note round-trips on a placeholder-less notes master)
        run: python skills/pptx-editing/scripts/selftest.py
